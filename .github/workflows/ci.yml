# NFR-06 / DC-05: lint, test and coverage gates block a merge to main.
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run lint
      # mongodb-memory-server downloads MongoDB 7 here; the coverage threshold in jest.config.js is the gate.
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high

  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2 # SR-11
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
